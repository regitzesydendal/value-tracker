name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # These two values are safe to embed in a public repo: the URL is just an
      # identifier, and the anon key is designed for browser code (security
      # comes from Supabase Row Level Security, see supabase/schema.sql).
      VITE_SUPABASE_URL: https://zxmkeeoivkaaqvjzpbpb.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_BEpjJKxhm-bPzLcV3m2Ilw_B4jn4GEd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
