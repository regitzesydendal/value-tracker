<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380">
  <g opacity="0.22" fill="none">
    <!-- Straw hat (One Piece-ish) -->
    <g transform="translate(80,82) rotate(-12)">
      <ellipse cx="0" cy="10" rx="30" ry="10" fill="#c9a227"/>
      <path d="M-17,10 Q-17,-15 0,-15 Q17,-15 17,10 Z" fill="#e6c766"/>
      <rect x="-17" y="2" width="34" height="6" rx="3" fill="#c0392b"/>
    </g>

    <!-- Devil fruit -->
    <g transform="translate(252,74)">
      <circle r="20" fill="#7e57c2"/>
      <path d="M-11,-3 q11,-13 21,0 q-11,13 -21,0" stroke="#4a148c" stroke-width="2.2"/>
      <path d="M-6,6 q7,-8 13,0" stroke="#4a148c" stroke-width="2.2"/>
      <path d="M3,-20 q7,-7 11,-2" stroke="#2e7d32" stroke-width="3.5"/>
    </g>

    <!-- Monster ball (Pokémon-ish) -->
    <g transform="translate(312,172)">
      <circle r="18" fill="#ffffff"/>
      <path d="M-18,0 A18,18 0 0 1 18,0 Z" fill="#e53935"/>
      <circle r="18" stroke="#263238" stroke-width="2.5"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#263238" stroke-width="2.5"/>
      <circle r="5.5" fill="#ffffff" stroke="#263238" stroke-width="2.5"/>
    </g>

    <!-- Lightning bolt -->
    <g transform="translate(150,178) rotate(8)">
      <path d="M4,-22 L-10,4 L-1,4 L-5,22 L13,-6 L2,-6 Z" fill="#f9a825"/>
    </g>

    <!-- Skull -->
    <g transform="translate(76,256)">
      <path d="M0,-16 C12,-16 18,-8 18,2 C18,9 13,12 10,14 L10,18 L-10,18 L-10,14 C-13,12 -18,9 -18,2 C-18,-8 -12,-16 0,-16 Z" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
      <circle cx="-7" cy="0" r="4" fill="#37474f"/>
      <circle cx="7" cy="0" r="4" fill="#37474f"/>
      <rect x="-2.5" y="6" width="5" height="6" rx="1" fill="#37474f"/>
    </g>

    <!-- Anchor -->
    <g transform="translate(186,300)">
      <circle cx="0" cy="-16" r="4" stroke="#455a64" stroke-width="3"/>
      <line x1="0" y1="-12" x2="0" y2="15" stroke="#455a64" stroke-width="3"/>
      <line x1="-9" y1="-5" x2="9" y2="-5" stroke="#455a64" stroke-width="3"/>
      <path d="M-15,6 Q-15,17 0,17 Q15,17 15,6" stroke="#455a64" stroke-width="3"/>
    </g>

    <!-- Paw print -->
    <g transform="translate(296,288)" fill="#8d6e63">
      <ellipse cx="0" cy="7" rx="9" ry="7"/>
      <circle cx="-8" cy="-4" r="3.5"/>
      <circle cx="0" cy="-7" r="3.5"/>
      <circle cx="8" cy="-4" r="3.5"/>
    </g>

    <!-- Sparkles -->
    <g fill="#ffca28">
      <path d="M200,205 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 Z"/>
      <path d="M120,150 l1.8,5.4 l5.4,1.8 l-5.4,1.8 l-1.8,5.4 l-1.8,-5.4 l-5.4,-1.8 l5.4,-1.8 Z"/>
      <path d="M330,250 l1.8,5.4 l5.4,1.8 l-5.4,1.8 l-1.8,5.4 l-1.8,-5.4 l-5.4,-1.8 l5.4,-1.8 Z"/>
    </g>
  </g>
</svg>
